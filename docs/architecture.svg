<svg xmlns="http://www.w3.org/2000/svg" width="640" height="740" viewBox="0 0 640 740" role="img" aria-labelledby="title desc">
  <title id="title">Turnwire architecture</title>
  <desc id="desc">CLI, TUI, and the Mac app connect locally to the host. The phone PWA connects through an encrypted Relay or tunnel channel. The host runs Turnwire Core, persists state in SQLite, and delegates execution through AgentRuntime to DSH. Credentials stay on the host.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-anchor: middle; fill: #172b4d; }
      .label { font-size: 20px; font-weight: 600; }
      .note { font-size: 16px; fill: #52647b; }
      .box { fill: #fff; stroke: #c8d5e5; stroke-width: 1.5; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="640" height="740" rx="20" fill="#f5f8fc"/>
  <text x="320" y="40" font-size="25" font-weight="700">One host. One session.</text>
  <rect class="box" x="24" y="68" width="278" height="78" rx="12"/>
  <text class="label" x="163" y="100">CLI · TUI · Mac app</text>
  <text class="note" x="163" y="127">Local clients</text>
  <rect class="box" x="338" y="68" width="278" height="78" rx="12"/>
  <text class="label" x="477" y="100">Phone PWA</text>
  <text class="note" x="477" y="127">Remote client</text>
  <path class="line" d="M477 146 V181"/>
  <rect class="box" x="338" y="184" width="278" height="78" rx="12"/>
  <text class="label" x="477" y="216">Relay / Tunnel</text>
  <text class="note" x="477" y="243">Encrypted session traffic</text>
  <path class="line" d="M163 146 V345"/>
  <text class="note" x="217" y="236">Local API</text>
  <path class="line" d="M477 262 V345"/>
  <rect x="24" y="302" width="592" height="414" rx="16" fill="#eaf2ff" stroke="#93b4e5" stroke-width="1.5"/>
  <text x="320" y="331" font-size="16" font-weight="700" fill="#315c99">YOUR HOST</text>
  <path class="line" d="M163 303 V345"/>
  <path class="line" d="M477 303 V345"/>
  <rect class="box" x="52" y="348" width="536" height="78" rx="12"/>
  <text class="label" x="320" y="380">turnwire-host · Turnwire Core</text>
  <text class="note" x="320" y="407">Sessions · Approvals · Command routing</text>
  <path class="line" d="M191 426 V473"/>
  <path class="line" d="M453 426 V473"/>
  <rect class="box" x="52" y="476" width="246" height="134" rx="12"/>
  <text class="label" x="175" y="509">SQLite</text>
  <text class="note" x="175" y="539">Metadata · Event cache</text>
  <text class="note" x="175" y="565">Approvals · Receipts</text>
  <text class="note" x="175" y="591">Persistent host state</text>
  <rect class="box" x="326" y="476" width="262" height="56" rx="12"/>
  <text class="label" x="457" y="511">AgentRuntime</text>
  <path class="line" d="M457 532 V562"/>
  <rect class="box" x="326" y="565" width="262" height="56" rx="12"/>
  <text class="label" x="457" y="600">DSH</text>
  <text class="note" x="320" y="660">Tasks execute on the host.</text>
  <text class="note" x="320" y="688">Model credentials stay here.</text>
</svg>
