# Credential references only. DSH resolves the inherited environment at runtime.
# Turnwire's own name, so an unrelated DSH-wide DEEPSEEK_API_KEY cannot be picked up instead.
- id: llm-deepseek
  config:
    apiKeyEnv: TURNWIRE_HARNESS_DEEPSEEK_API_KEY

- id: web-search-deepseek
  config:
    apiKeyEnv: TURNWIRE_HARNESS_DEEPSEEK_API_KEY

# A second provider route: a local OpenAI-compatible endpoint served by codex-provider-bridge,
# which bridges the ChatGPT/Codex login into OpenAI shapes. The endpoint itself takes no credential
# (the key is a placeholder the client is expected to send), so the name only has to exist.
# This bridge cannot emit tool calls — it answers tool-bearing requests with text — so a route here
# suits a conversation, not an agent turn that has to run anything.
- id: llm-pi-ai
  config:
    providers:
      bridge:
        displayName: Codex bridge
        baseURL: http://127.0.0.1:8790/v1
        api: openai-completions
        apiKeyEnv: TURNWIRE_HARNESS_CODEX_BRIDGE_KEY
        models:
          # The endpoint's own /v1/models is the authority for these ids, and this list is exactly what
          # it answers with: the bridge dropped the 5.4 pair and gained gpt-6-astra. A model the
          # endpoint serves but this list omits is not offered by the Host at all.
          - id: gpt-6-astra
            name: GPT-6 Astra
          - id: gpt-5.6-sol
            name: GPT-5.6 Sol
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
          - id: gpt-5.5
            name: GPT-5.5
