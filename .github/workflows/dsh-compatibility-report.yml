name: DSH compatibility report
on:
  workflow_run:
    workflows: [DSH compatibility]
    types: [completed]
permissions: {}
concurrency:
  group: dsh-compatibility-report
  cancel-in-progress: false
jobs:
  report:
    if: >-
      github.repository == 'turnwire/turnwire' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      # No checkout, artifacts, external scripts or PR-controlled text are executed.
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = '[DSH compatibility] Latest scheduled/manual matrix failure';
            const {owner, repo} = context.repo;
            const newer = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: run.workflow_id, branch: 'main', per_page: 100});
            if (newer.data.workflow_runs.some(candidate => candidate.run_number > run.run_number && ['schedule', 'workflow_dispatch'].includes(candidate.event))) return;
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(issue => issue.title === title && !issue.pull_request);
            const url = `${context.serverUrl}/${owner}/${repo}/actions/runs/${run.id}`;
            if (run.conclusion === 'failure') {
              const body = `Real DSH compatibility failed: ${url}\n\nMatrix: Linux/macOS × baseline/latest/next. See exact resolved versions and failed phases in job logs. No inference calls are made. Investigate before attributing the failure to upstream incompatibility.`;
              if (issue) await github.rest.issues.update({owner, repo, issue_number: issue.number, body});
              else await github.rest.issues.create({owner, repo, title, body});
            } else if (run.conclusion === 'success' && issue) {
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body: `All compatibility matrix cells passed: ${url}`});
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: 'closed'});
            }
