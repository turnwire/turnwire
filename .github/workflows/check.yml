name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # The model picker is the only client surface that needs a real browser, and the catalog
      # lists provider routes before any turn runs, so no model credential is required.
      # TURNWIRE_REQUIRE_BROWSER keeps a runner-image change from silently skipping this check.
      - name: Model picker in the phone PWA
        env:
          TURNWIRE_REQUIRE_BROWSER: '1'
        run: |
          npm ci --prefix config/dsh-runtime
          bash scripts/ui-model-check.sh
      # History paging only needs the built PWA and a browser, which the runner already has.
      # It imports the TypeScript sources directly, so it runs through tsx like the suite does.
      - name: History paging in the phone PWA
        run: node --import tsx scripts/history-ui-check.mjs
