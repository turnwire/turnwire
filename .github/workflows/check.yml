name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      # The model picker is the only client surface that needs a real browser. It skips itself
      # when no Chrome is present, and needs no model credential because the catalog lists
      # provider routes before any turn runs.
      - name: Model picker in the phone PWA
        run: |
          npm ci --prefix config/dsh-runtime
          bash scripts/ui-model-check.sh
