name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Everything a push needs to answer for: strict types, the suite and the production bundles.
      # The browser scenarios live in scenarios.yml and are run on demand instead, because each one
      # boots a real Relay/daemon/DSH and they describe behaviour that was verified once, not a
      # contract every commit has to re-prove.
      - run: npm run check
